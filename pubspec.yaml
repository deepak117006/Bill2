name: perixa_billing
description: Perixa Billing Pro - mobile companion for the PC app.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.3.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.0
  pdf: ^3.10.0
  printing: ^5.12.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.1
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon.png
